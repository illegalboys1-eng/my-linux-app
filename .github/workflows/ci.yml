# Pipeline name — shows up in GitHub UI
name: CI Pipeline

# WHEN does this pipeline run?
on:
  push:
    branches: [ main ]        # Run on every push to main
  pull_request:
    branches: [ main ]        # Run on every Pull Request to main

# WHAT does it do?
jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest    # GitHub provides this VM for free

    steps:
      # Step 1 — Download your code onto the runner VM
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3 — Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      # Step 4 — Run tests
      - name: Run tests
        run: pytest tests/ -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test              # Only run if test job passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 5 — Build Docker image
      - name: Build Docker image
        run: docker build -t my-python-app:${{ github.sha }} .

      # Step 6 — Confirm image was built
      - name: Verify image
        run: docker images
